# Налаштування адмінки (Sveltia CMS).
backend:
  name: github
  repo: alukatskaya/namiorder
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads
locale: uk
site_url: https://nami.coffee
display_url: https://nami.coffee

collections:
  - name: coffee
    label: Кава та ціни
    files:
      - name: products
        label: Каталог кав
        file: content/products.json
        format: json
        fields:
          - label: Кави
            name: items
            widget: list
            label_singular: каву
            summary: "{{fields.country}} {{fields.name}} — {{fields.process}}"
            fields:
              - { label: "Адреса кави (латиницею, без пробілів, не змінювати для існуючих)", name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Тільки малі латинські літери, цифри та дефіс"] }
              - label: Розділ
                name: tier
                widget: select
                options:
                  - { label: Еспресо, value: espresso }
                  - { label: Фільтр, value: filter }
              - { label: Країна, name: country, widget: string }
              - { label: Назва, name: name, widget: string }
              - { label: Обробка, name: process, widget: string }
              - { label: Смакові ноти, name: notes, widget: string, hint: "Через крапку: dried fruits · green apple" }
              - { label: Сорт, name: variety, widget: string, required: false }
              - { label: Висота, name: altitude, widget: string, required: false }
              - { label: Опис (для сторінки кави), name: description, widget: text, required: false }
              - label: Формати та ціни
                name: prices
                widget: list
                label_singular: формат
                summary: "{{fields.size}} — {{fields.price}} ₴"
                fields:
                  - { label: Формат (наприклад 250 g), name: size, widget: string }
                  - { label: Ціна, name: price, widget: number, value_type: int, min: 1 }
              - { label: Фото хвилі, name: photo, widget: image, required: false, hint: "Якщо фото немає, показується анімована хвиля" }
              - { label: Показувати на сайті, name: available, widget: boolean, default: true }
              - label: Анімована хвиля (коли немає фото)
                name: wave
                widget: object
                collapsed: true
                fields:
                  - { label: Кольори, name: colors, widget: list, field: { label: Колір, name: color, widget: color } }
                  - { label: "Розмах (12 — спокійна, 30 — неспокійна)", name: amp, widget: number, value_type: float }
                  - { label: Частота хвилі, name: freq, widget: number, value_type: float }

  - name: site
    label: Тексти сайту
    files:
      - name: site
        label: Усі тексти
        file: content/site.json
        format: json
        fields:
          - { label: Назва бренду, name: brand, widget: string }
          - { label: Дата карти (шапка головного екрана), name: season, widget: string }
          - { label: Головний заголовок, name: heroTitle, widget: string }
          - { label: Текст під заголовком, name: heroText, widget: text }
          - { label: Підказка на хвилі, name: heroHint, widget: string }
          - { label: Ієрогліф на головній, name: teaserKanji, widget: string }
          - { label: Заголовок блоку «ма» на головній, name: teaserTitle, widget: string }
          - { label: Короткий текст «ма» на головній, name: teaserText, widget: text }
          - { label: Заголовок каталогу, name: catalogTitle, widget: string }
          - { label: Підказка над каталогом, name: catalogHint, widget: string }
          - label: Розділи каталогу
            name: tiers
            widget: list
            label_singular: розділ
            summary: "{{fields.title}}"
            fields:
              - { label: "Код розділу (не змінювати: espresso або filter)", name: id, widget: string }
              - { label: Назва вкладки, name: title, widget: string }
              - { label: Опис під вкладкою, name: lede, widget: text }
          - { label: "Сторінка «Про NAMI»: заголовок", name: aboutTitle, widget: string }
          - { label: "Сторінка «Про NAMI»: ієрогліф", name: aboutKanji, widget: string }
          - { label: "Сторінка «Про NAMI»: текст (абзаци розділяйте порожнім рядком)", name: aboutText, widget: text }
          - { label: "Сторінка доставки: заголовок", name: infoTitle, widget: string }
          - { label: Доставка (заголовок), name: deliveryTitle, widget: string }
          - { label: Доставка (текст), name: deliveryText, widget: text }
          - { label: Оплата (заголовок), name: paymentTitle, widget: string }
          - { label: Оплата (текст), name: paymentText, widget: text }
          - { label: Контакти (заголовок), name: contactTitle, widget: string }
          - { label: "Telegram (нік без @)", name: telegram, widget: string }
          - { label: "Instagram (нік без @)", name: instagram, widget: string }
          - { label: Фраза внизу сторінок, name: closing, widget: string }
          - { label: Підпис у футері, name: footer, widget: string }
